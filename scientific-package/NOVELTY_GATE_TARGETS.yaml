schema: cyclicity-novelty-gate-targets-v1
search_date: 2026-08-27
shared_source:
  originating_reference: "Cyclicity Support-Fusion Atlas v0.7.0-candidate"
  url: "https://evidencepress.org/releases/cyclicity-support-fusion-atlas/"
  archive_sha256: "3a132530f31c1af3870de7af7a13d41389ffbf051ab2760b3c0110173c268e8a"
search_constraints:
  primary_sources_only_for_technical_claims: true
  databases_or_corpora:

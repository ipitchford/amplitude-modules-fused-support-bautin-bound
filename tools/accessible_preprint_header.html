<style>
  :root { color-scheme: light dark; }
  html { font-family: Georgia, "Times New Roman", serif; line-height: 1.55; }
  body { margin: 0 auto; max-width: 78rem; padding: 1.5rem; }
  main { max-width: 72ch; }
  h1, h2, h3, h4 { line-height: 1.2; }
  a { text-underline-offset: 0.15em; }
  nav#TOC { border-block: 1px solid currentColor; margin-block: 1.5rem; padding-block: 1rem; }
